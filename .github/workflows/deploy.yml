name: Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm ci
        working-directory: functions

      - run: npm run build
        working-directory: functions

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Write emulator secrets
        run: |
          echo "RESEND_API_KEY=re_emulator_dummy" > functions/.secret.local
          echo "HMAC_SECRET=local-dev-secret" >> functions/.secret.local

      - name: Run tests
        env:
          VITE_APP_USE_EMULATOR: "true"
          VITE_FIREBASE_PROJECT_ID: "demo-ct-chickens"
          VITE_FIREBASE_API_KEY: "fake-key"
          VITE_FIREBASE_AUTH_DOMAIN: "demo-ct-chickens.firebaseapp.com"
          VITE_FIREBASE_STORAGE_BUCKET: "demo-ct-chickens.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "12345678"
          VITE_FIREBASE_APP_ID: "1:12345678:web:12345678"
        run: npx firebase emulators:exec "npm run test" --project demo-ct-chickens

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GIT_COMMIT_HASH: ${{ github.sha }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: './dist'

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: './dist'
          retention-days: 1

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4

  deploy-functions:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
        working-directory: functions

      - run: npm run build
        working-directory: functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase functions, rules, and indexes
        run: npx firebase deploy --only firestore,storage,functions --force --project ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: './dist'

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to staging
        run: npx firebase hosting:channel:deploy staging --project ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: './dist'

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy preview channel
        id: deploy
        run: |
          npx firebase hosting:channel:deploy pr-${{ github.event.number }} --expires 7d --project ${{ secrets.VITE_FIREBASE_PROJECT_ID }} 2>&1 | tee /tmp/deploy-out.txt
          URL=$(grep -oP 'https://\S+\.web\.app' /tmp/deploy-out.txt | head -1)
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔥 Preview deployed: ${{ steps.deploy.outputs.url }}`
            })
