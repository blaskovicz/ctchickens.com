<h2 style="color:#6b7280;margin:0 0 16px;font-size:22px;font-weight:700;">
  Your classified has expired
</h2>
<p style="color:#374151;line-height:1.7;margin:0 0 16px;font-size:15px;">
  Hi {{firstName}}, your <strong>{{#if title}}{{title}}{{else}}{{categoryLabel}}{{/if}}</strong> listing expired on <strong>{{expiresAt}}</strong>.
</p>
<p style="color:#374151;line-height:1.7;margin:0 0 24px;font-size:15px;">
  It will be permanently deleted in <strong>7 days</strong>. Before then, you can <strong>clone it to repost instantly</strong>.
</p>

<table cellpadding="0" cellspacing="0" role="presentation" style="margin:0 0 16px;">
  <tr>
    <td style="background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 100%);border-radius:8px;">
      <a href="{{classifiedUrl}}" target="_blank"
        style="display:inline-block;padding:14px 32px;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;">
        Clone Expired Listing &rarr;
      </a>
    </td>
  </tr>
</table>
