<h2 style="color:#1e3a8a;margin:0 0 16px;font-size:22px;font-weight:700;">
  You have an unread message
</h2>
<p style="color:#374151;line-height:1.7;margin:0 0 16px;font-size:15px;">
  <strong>{{senderName}}</strong> is waiting for your reply. Head to your inbox to keep the conversation going.
</p>

<!-- CTA Button -->
<table cellpadding="0" cellspacing="0" role="presentation" style="margin:0 0 32px;">
  <tr>
    <td style="background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 100%);border-radius:8px;">
      <a href="{{inboxUrl}}" target="_blank"
        style="display:inline-block;padding:14px 32px;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;">
        View Message &rarr;
      </a>
    </td>
  </tr>
</table>
