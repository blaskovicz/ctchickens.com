<h2 style="color:#b45309;margin:0 0 16px;font-size:22px;font-weight:700;">
  Your classified is expiring soon
</h2>
<p style="color:#374151;line-height:1.7;margin:0 0 16px;font-size:15px;">
  Hi {{firstName}}, your <strong>{{categoryLabel}}</strong> listing expires on <strong>{{expiresAt}}</strong>.
</p>
<p style="color:#374151;line-height:1.7;margin:0 0 24px;font-size:15px;">
  Visit your listing to renew it before it expires and disappears from the directory.
</p>

<table cellpadding="0" cellspacing="0" role="presentation" style="margin:0 0 16px;">
  <tr>
    <td style="background:linear-gradient(135deg,#b45309 0%,#d97706 100%);border-radius:8px;">
      <a href="{{classifiedUrl}}" target="_blank"
        style="display:inline-block;padding:14px 32px;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;">
        Renew Your Listing &rarr;
      </a>
    </td>
  </tr>
</table>

<p style="margin:0 0 32px;">
  <a href="https://ctchickens.com/#/classified" target="_blank"
    style="color:#1e3a8a;font-size:14px;text-decoration:underline;">
    Browse All Classifieds
  </a>
</p>
