<h2 style="color:#1e3a8a;margin:0 0 16px;font-size:22px;font-weight:700;">
  {{subject}}
</h2>

{{#if businessName}}
<p style="color:#374151;line-height:1.7;margin:0 0 16px;font-size:15px;">
  Hi {{firstName}},
</p>
{{else}}
<p style="color:#374151;line-height:1.7;margin:0 0 16px;font-size:15px;">
  Hi {{firstName}},
</p>
{{/if}}

<!-- Custom body (pre-rendered HTML from markdown) -->
<div style="color:#374151;line-height:1.7;font-size:15px;margin:0 0 28px;">
  {{{customBody}}}
</div>

  <tr>
    <td style="border-top:1px solid #e2e8f0;"></td>
  </tr>
</table>
