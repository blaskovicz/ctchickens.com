<h2 style="color:#1e3a8a;margin:0 0 16px;font-size:22px;font-weight:700;">
  Your listing has been renewed
</h2>
<p style="color:#374151;line-height:1.7;margin:0 0 16px;font-size:15px;">
  Hi {{firstName}}, your <strong>{{categoryLabel}}</strong> listing has been renewed and is active until <strong>{{newExpiresAt}}</strong>.
</p>

<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="margin:0 0 28px;background:#f8faff;border-radius:8px;border:1px solid #e2e8f0;">
  <tr>
    <td style="padding:20px;">
      <p style="margin:0;font-size:14px;color:#374151;"><strong>Renewals remaining:</strong> {{renewalsRemaining}}</p>
    </td>
  </tr>
</table>

<table cellpadding="0" cellspacing="0" role="presentation" style="margin:0 0 16px;">
  <tr>
    <td style="background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 100%);border-radius:8px;">
      <a href="{{classifiedUrl}}" target="_blank"
        style="display:inline-block;padding:14px 32px;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;">
        View Your Listing &rarr;
      </a>
    </td>
  </tr>
</table>

<p style="margin:0 0 32px;">
  <a href="https://ctchickens.com/#/classified" target="_blank"
    style="color:#1e3a8a;font-size:14px;text-decoration:underline;">

  </a>
</p>
